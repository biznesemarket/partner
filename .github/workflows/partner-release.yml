name: partner-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: build and publish artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Собрать wheel и sdist
        run: |
          pip install build
          python -m build
      - name: Проверить wheel в чистом окружении
        run: |
          python -m venv /tmp/release-venv
          /tmp/release-venv/bin/pip install --upgrade pip
          /tmp/release-venv/bin/pip install dist/*.whl
          /tmp/release-venv/bin/partner --help >/dev/null
          /tmp/release-venv/bin/python -c "import partner_cli, partner_agent_kit, partner_connectors"
      - name: Артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: partner-tracker-dist
          path: dist/
      - name: GitHub Release с артефактами поставки
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --generate-notes
      - name: Манифест поставки (sha256 + API URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/partner_dist.py manifest \
            --dist dist --tag "${{ github.ref_name }}" --out dist-manifest.json
          gh release upload "${{ github.ref_name }}" dist-manifest.json --clobber
      - name: Проверить опубликованный asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/release-check && mkdir -p /tmp/release-check
          python tools/partner_dist.py resolve \
            --version "${{ github.ref_name }}" \
            --download /tmp/release-check --json > /tmp/release-check/resolution.json
          python -m venv /tmp/release-check-venv
          /tmp/release-check-venv/bin/pip install --upgrade pip
          /tmp/release-check-venv/bin/pip install /tmp/release-check/*.whl
          mkdir -p /tmp/release-check-client
          cp repo-pack/policy.example.yaml /tmp/release-check-client/policy.yaml
          cd /tmp/release-check-client
          /tmp/release-check-venv/bin/partner day --demo > /tmp/release-check/day.out
          test -s /tmp/release-check/day.out

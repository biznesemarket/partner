# Alembic migrations for Partner (PostgreSQL in prod, SQLite in demo).
[alembic]
script_location = migrations
prepend_sys_path = apps
version_path_separator = os

# URL comes from PARTNER_DB_URL (migrations/env.py). The default is local
# SQLite so `alembic upgrade head` works out of the box; set the env var for
# PostgreSQL. Keep this file ASCII-only: Alembic reads it using the OS locale.
sqlalchemy.url = sqlite:///./data/partner_server.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

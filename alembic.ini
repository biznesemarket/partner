# Alembic: миграции схемы «Партнер» (PostgreSQL в prod, SQLite в demo)
[alembic]
script_location = migrations
prepend_sys_path = apps
version_path_separator = os

# URL берется из PARTNER_DB_URL (migrations/env.py). Дефолт — локальный SQLite,
# чтобы `alembic upgrade head` работал без настроек; для PostgreSQL задайте env.
sqlalchemy.url = sqlite:///./data/partner_server.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

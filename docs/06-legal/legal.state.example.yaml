# Состояние юридического модуля (M7, legal-module.md §4)
#
# Файл редактируется юристом (команды partner legal-gate / legal-enable
# или правкой вручную). Персональные данные и подписанные договоры —
# в закрытом контуре, в git клиента НЕ попадает (legal-module.md §6).
#
# Статус гейта: open | done. done требует evidence — документ, дата,
# подписант (≥5 символов).

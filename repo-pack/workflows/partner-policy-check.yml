# CI репозитория клиента: валидация политики «Партнер» при каждом PR.
# Ставится мастером `partner init` (repo-pack/workflows/).
name: partner-policy-check

on:
  pull_request:
    paths:
      - "policy.yaml"
      - "AGENTS.md"
  push:
    branches: [main]
    paths:
      - "policy.yaml"

jobs:
  policy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить partner-tracker (публичный release или приватный индекс)
        env:
          # Вариант 1: URL wheel из GitHub Release (публичный или секрет зеркала).
          PARTNER_TRACKER_WHEEL: ${{ secrets.PARTNER_TRACKER_WHEEL }}
          # Вариант 2: приватный PyPI-индекс.
          PARTNER_TRACKER_INDEX_URL: ${{ secrets.PARTNER_TRACKER_INDEX_URL }}
          # Токен нужен только для приватного API URL (fine-grained PAT).
          PARTNER_TRACKER_TOKEN: ${{ secrets.PARTNER_TRACKER_TOKEN }}
          # Ожидаемый sha256 wheel из dist-manifest.json релиза.
          PARTNER_TRACKER_SHA256: ${{ secrets.PARTNER_TRACKER_SHA256 }}
        run: |
          set -euo pipefail
          if [ -n "${PARTNER_TRACKER_INDEX_URL}" ]; then
            pip install --index-url "${PARTNER_TRACKER_INDEX_URL}" partner-tracker
            exit 0
          fi
          if [ -z "${PARTNER_TRACKER_WHEEL}" ]; then
            echo "::error::Задайте PARTNER_TRACKER_WHEEL или PARTNER_TRACKER_INDEX_URL; публичный PyPI не используется"
            exit 1
          fi
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          # Валидное имя wheel: pip не принимает произвольный файл.
          wheel="${tmp}/partner_tracker-0.0.0-py3-none-any.whl"
          case "${PARTNER_TRACKER_WHEEL}" in
            https://api.github.com/*)
              if [ -n "${PARTNER_TRACKER_TOKEN}" ]; then
                curl -fsSL --retry 3 \
                  -H "Authorization: Bearer ${PARTNER_TRACKER_TOKEN}" \
                  -H "Accept: application/octet-stream" \
                  -o "${wheel}" "${PARTNER_TRACKER_WHEEL}"
              else
                # Публичный репозиторий: API asset доступен без токена.
                curl -fsSL --retry 3 \
                  -H "Accept: application/octet-stream" \
                  -o "${wheel}" "${PARTNER_TRACKER_WHEEL}"
              fi
              ;;
            *)
              # Публичный browser URL или приватный индекс — без токена.
              curl -fsSL --retry 3 -o "${wheel}" "${PARTNER_TRACKER_WHEEL}"
              ;;
          esac
          python - "${wheel}" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          if not zipfile.is_zipfile(path):
              raise SystemExit(f"не wheel: {path}")
          with zipfile.ZipFile(path) as archive:
              if not any(name.endswith(".dist-info/METADATA") for name in archive.namelist()):
                  raise SystemExit("в архиве нет .dist-info/METADATA")
          PY
          if [ -n "${PARTNER_TRACKER_SHA256}" ]; then
            echo "${PARTNER_TRACKER_SHA256}  ${wheel}" | sha256sum -c -
          fi
          pip install "${wheel}"

      - name: Проверить policy.yaml
        run: |
          python -m partner_cli.policy_lint policy.yaml --as-of "$(date -u +%F)"
          echo "policy.yaml валидна: правила учета «Партнер» применены"

      - name: Проверить целостность блока AGENTS.md
        run: |
          grep -q "BEGIN PARTNER BLOCK" AGENTS.md || {
            echo "::error::Блок учета «Партнер» отсутствует в AGENTS.md"; exit 1; }
          grep -q "END PARTNER BLOCK" AGENTS.md || {
            echo "::error::Незакрытый блок учета в AGENTS.md"; exit 1; }
          echo "Блок AGENTS.md на месте"

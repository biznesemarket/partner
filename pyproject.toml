[project]
name = "partner-tracker"
version = "1.3.0"
description = "Партнер — учет времени работы с ИИ-агентом и ежедневного начисления долей"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Проект «Партнер»" }]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.0",
    # нужен repo-pack workflow: python -m partner_cli.policy_lint
    "jsonschema>=4.20",
    # zoneinfo на Windows без системной tzdata
    "tzdata>=2024.1",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "markdown-it-py>=4.0",
    "ruff>=0.6",
    "build>=1.2",
]

[project.urls]
Repository = "https://github.com/biznesemarket/partner"

[project.scripts]
partner = "partner_cli.cli:app"
partner-agent = "partner_agent_kit.cli:app"
partner-mcp = "partner_agent_kit.mcp_server:main"
partner-connector = "partner_connectors.cli:app"
partner-seed = "partner_server.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps"]
include = ["partner_cli*", "partner_server*", "partner_agent_kit*", "partner_connectors*"]

[tool.setuptools.package-data]
partner_cli = ["policy.schema.json", "schema.sql"]
partner_server = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["docs-site", "data", ".venv"]

[tool.ruff.lint]
# Консервативный набор: синтаксис/импорты/неиспользуемые имена.
# Стилевые правила (B008 для FastAPI Depends и т.п.) не включаются намеренно.
select = ["E4", "E7", "E9", "F"]
